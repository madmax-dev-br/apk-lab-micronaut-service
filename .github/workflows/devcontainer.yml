name: Devcontainer (Codespaces)

# Builds the same container Codespaces builds (.devcontainer/devcontainer.json), runs its setup and checks that the runner starts and answers.
on:
  push:
    branches: [main]
    paths: ['.devcontainer/**', 'sidecar/runtime.lock.json', 'sidecar/fetch-runtime.mjs', '.github/workflows/devcontainer.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: bash .devcontainer/smoke.sh
